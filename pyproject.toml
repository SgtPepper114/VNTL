[project]
name = "vntl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai",
    "truststore>=0.10.5; sys_platform == 'win32'",
    "pyqt6>=6.6.0,<6.11.0",
    "qasync",
    "mss",
    "pillow",
    "hidapi>=0.14,<0.16",
    "sudachipy==0.6.11",
    "sudachidict-core==20260428",
    "meikiocr==0.3.5",
    "onnxruntime==1.31.1",
]

[dependency-groups]
dev = [
    "pyinstaller",
    "pyinstaller-hooks-contrib",
]
